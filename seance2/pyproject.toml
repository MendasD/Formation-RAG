[project]
name = "rag-pdf"
version = "0.1.0"
description = "RAG sur PDF — Formation RAG, séance 2 (Naive RAG fonctionnel)"
authors = [{ name = "Christ Nzonde" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Orchestration
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    # LLM & embeddings
    "langchain-groq>=0.2",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    # Vector store
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    # PDF
    "pymupdf>=1.24",
    # Tokenization (pour TokenTextSplitter et comptage de tokens)
    "tiktoken>=0.7",
    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    # CLI & UX
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1",
    "ipykernel>=6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pdf"]

[tool.hatch.metadata]
allow-direct-references = true
